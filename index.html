const UI = {
  _liveSig: '',

  /* ---------- Render principal ---------- */
  render() {
    const route = Router.parse();
    const redirect = Router.guard(route);
    if (redirect) {
      const cur = location.hash || '#/';
      if (redirect !== cur && !(redirect === '#/' && (cur === '#' || cur === '#/' || cur === ''))) { location.hash = redirect; return; }
    }
    const user = AuthService.currentUser();
    const snap = this.captureForm();
    let main = '';
    if (route.name === 'aluno') main = Views.aluno(user);
    else if (route.name === 'professor') main = Views.professor(user, route);
    else if (route.name === 'admin') main = Views.admin(user, route);
    else main = Views.portal();
    const wide = route.name === 'admin';
    document.getElementById('app').innerHTML = `${Views.header(user, wide)}<main id="main" tabindex="-1">${main}</main>${Views.footer(wide)}`;
    this.restoreForm(snap);
    this.renderProjection();
    this.afterRender();
    this._liveSig = this.liveSignature(Date.now());
  },
  afterRender() {
    this.icons();
    this.refreshQR(true);
    this.updateLive(Date.now());
    if (ui.student.scanning) {
      const slot = document.getElementById('cam-slot');
      if (slot) { const v = CameraScanner.getVideo(); if (v.parentNode !== slot) slot.appendChild(v); v.play && v.play().catch(() => {}); }
    }
  },
  icons() { try { if (window.lucide) window.lucide.createIcons({ icons: window.lucide.icons, attrs: { 'stroke-width': 2 } }); } catch (e) { /* ícones são decorativos */ } },
  captureForm() {
    const root = document.getElementById('app'); const fields = {};
    if (!root) return { fields, focus: null };
    root.querySelectorAll('input[id], textarea[id], select[id]').forEach((el) => {
      if (el.hasAttribute('data-nopreserve')) return;
      fields[el.id] = (el.type === 'checkbox' || el.type === 'radio') ? { checked: el.checked } : { value: el.value };
    });
    const a = document.activeElement; let focus = null;
    if (a && a.id && root.contains(a)) { focus = { id: a.id }; try { focus.start = a.selectionStart; focus.end = a.selectionEnd; } catch (e) { /* select */ } }
    return { fields, focus };
  },
  restoreForm(snap) {
    if (!snap) return;
    Object.entries(snap.fields).forEach(([id, f]) => {
      const el = document.getElementById(id); if (!el) return;
      if ('checked' in f) el.checked = f.checked;
      else if (el.tagName !== 'SELECT' || [...el.options].some((o) => o.value === f.value)) el.value = f.value;
    });
    if (snap.focus) {
      const el = document.getElementById(snap.focus.id);
      if (el) { el.focus({ preventScroll: true }); try { if (snap.focus.start != null) el.setSelectionRange(snap.focus.start, snap.focus.end); } catch (e) { /* tipo sem seleção */ } }
    }
  },

  /* ---------- Estado ao vivo ---------- */
  liveStatus(now) {
    const ativas = Repo.aulasAtivas();
    const open = ativas.find((a) => QRCodeEngine.windowOpen(a, now));
    if (open) { const { disc } = Repo.ctx(open); return { kind: 'live', aula: open, text: `Aula ao vivo disponível agora: ${disc.nome} (${disc.codigo})` }; }
    if (ativas.length) { const { disc } = Repo.ctx(ativas[0]); return { kind: 'waiting', aula: ativas[0], text: `Chamada de ${disc.nome} (${disc.codigo}) com leitura encerrada, aguardando o professor` }; }
    return { kind: 'none', text: 'Nenhuma aula ao vivo no momento' };
  },
  liveSignature(now) { return Repo.aulasAtivas().map((a) => `${a.id}:${QRCodeEngine.windowOpen(a, now) ? 1 : 0}`).join('|'); },
  refreshQR(force = false) {
    const now = Date.now();
    document.querySelectorAll('[data-qr-aula]').forEach((el) => {
      const aulaId = el.dataset.qrAula; const cur = QRCodeEngine.current(aulaId, now);
      const text = cur ? QRCodeEngine.payload(aulaId, cur.token) : '';
      const changed = el.dataset.qrText !== undefined && el.dataset.qrText !== text;
      QRCodeEngine.render(el, text, Number(el.dataset.qrSize) || 512);
      if (changed && !force) { const box = el.closest('.qr-box'); if (box) { box.classList.add('is-rotated'); setTimeout(() => box.classList.remove('is-rotated'), 700); } }
    });
    document.querySelectorAll('[data-token-text]').forEach((el) => { const cur = QRCodeEngine.current(el.dataset.tokenText, now); el.textContent = Utils.fmtToken(cur && cur.token); });
  },
  updateLive(now) {
    document.querySelectorAll('[data-countdown-to]').forEach((el) => { el.textContent = Utils.fmtDuration(Number(el.dataset.countdownTo) - now); });
    document.querySelectorAll('[data-elapsed-from]').forEach((el) => { el.textContent = Utils.fmtDuration(now - Number(el.dataset.elapsedFrom)); });
    document.querySelectorAll('[data-token-countdown]').forEach((el) => { const c = QRCodeEngine.current(el.dataset.tokenCountdown, now); el.textContent = c ? String(Math.max(0, Math.ceil((c.expiraEm - now) / 1000))) : '—'; });
    document.querySelectorAll('[data-token-progress]').forEach((el) => { const c = QRCodeEngine.current(el.dataset.tokenProgress, now); el.style.width = c ? `${Math.max(0, Math.min(100, ((c.expiraEm - now) / CONFIG.TOKEN_ROTATION_MS) * 100))}%` : '0%'; });
  },
  tick() {
    const now = Date.now();
    if (document.visibilityState === 'visible' && QRCodeEngine.tick(now)) this.refreshQR();
    else if (document.querySelector('[data-qr-aula]')) this.refreshQR();
    this.updateLive(now);
    const sig = this.liveSignature(now);
    if (sig !== this._liveSig && !document.querySelector('.modal-backdrop')) this.render();
  },

  /* ---------- Projeção (RI04) ---------- */
  renderProjection() {
    const root = document.getElementById('projection-root');
    const aula = ui.projection ? Repo.aula(ui.projection) : null;
    if (!aula || aula.status !== 'ATIVA') { if (root.innerHTML) root.innerHTML = ''; ui.projection = null; return; }
    const { turma, disc } = Repo.ctx(aula); const now = Date.now(); const open = QRCodeEngine.windowOpen(aula, now);
    const presentes = Repo.presencasDaAula(aula.id).length;
    root.innerHTML = `<div class="projection" role="dialog" aria-modal="true" aria-label="Modo projeção do QR Code">
      <div class="proj-top"><div class="flex items-center gap-2.5">${LOGO}<span class="font-bold text-lg">PresençaQR</span></div>
      <button class="btn btn-secondary btn-sm" data-action="projection-off">${H.icon('minimize-2')} Sair da projeção <span class="text-slate-400 font-normal hidden sm:inline">(Esc)</span></button></div>
      <p class="mono text-sm font-semibold text-indigo-600 mt-10">${H.e(disc.codigo)} · ${H.e(turma.codigo)}</p>
      <h2 class="text-2xl sm:text-4xl font-extrabold tracking-tight -mt-2">${H.e(disc.nome)}</h2>
      ${open ? `<div class="qr-box proj-qr"><div data-qr-aula="${aula.id}" data-qr-size="720"></div></div>
      <p class="token-text proj-token" data-token-text="${aula.id}">———</p>
      <div class="flex flex-wrap justify-center gap-2.5"><span class="badge badge-warn badge-lg">${H.icon('refresh-cw')} Novo código em <span class="mono" data-token-countdown="${aula.id}">—</span> s</span>
      <span class="badge badge-neutral badge-lg">${H.icon('timer')} Leituras por mais <span class="mono" data-countdown-to="${aula.chamadaExpiraEm}">—</span></span>
      <span class="badge badge-accent badge-lg">${H.icon('users')} ${presentes} de ${turma.alunoIds.length} presentes</span></div>
      <p class="text-slate-500 text-base">Abra o PresençaQR no celular e toque em <strong class="text-slate-700">Escanear QR Code da Aula</strong>.</p>`
      : `<div class="card max-w-md">${H.icon('lock', 'w-10 h-10 mx-auto text-rose-600')}<p class="text-2xl font-bold mt-4">Leitura encerrada</p><p class="text-slate-600 mt-2">A validade desta chamada terminou. O QR Code não aceita mais leituras (RN05).</p></div>`}
    </div>`;
    this.icons(); this.refreshQR(true); this.updateLive(now);
  },
  async enterProjection(aulaId) {
    ui.projection = aulaId; this.renderProjection();
    try { if (document.documentElement.requestFullscreen && !document.fullscreenElement) { await document.documentElement.requestFullscreen(); ui.projectionFS = true; } } catch (e) { ui.projectionFS = false; }
  },
  exitProjection() {
    ui.projection = null; ui.projectionFS = false; this.renderProjection();
    try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); } catch (e) { /* ok */ }
  },

  /* ---------- Toasts ---------- */
  toast(message, tone = 'ok', title = '') {
    const root = document.getElementById('toast-root'); if (!root) return;
    const icons = { ok: 'circle-check', error: 'circle-x', warn: 'triangle-alert', info: 'info' };
    const el = document.createElement('div');
    el.className = `toast toast-${tone}`; el.setAttribute('role', tone === 'error' ? 'alert' : 'status');
    el.innerHTML = `${H.icon(icons[tone] || 'info', 'ti')}<div class="flex-1 min-w-0">${title ? `<p class="font-semibold">${H.e(title)}</p>` : ''}<p>${H.e(message)}</p></div><button class="toast-x" aria-label="Fechar notificação">${H.icon('x', 'w-4 h-4')}</button>`;
    root.appendChild(el);
    while (root.children.length > 3) root.firstElementChild.remove();
    this.icons();
    const close = () => { el.classList.add('toast-out'); setTimeout(() => el.remove(), 260); };
    el.querySelector('.toast-x').addEventListener('click', close);
    setTimeout(close, tone === 'error' ? 6500 : 4200);
  },

  /* ---------- Modal ---------- */
  modal: {
    current: null,
    open({ title, subtitle = '', body = '', footer = '', drawer = false, onClose = null, onConfirm = null, ctx = null }) {
      const root = document.getElementById('modal-root');
      const prev = this.current;
      this.current = { onClose, onConfirm, ctx, lastFocus: prev ? prev.lastFocus : document.activeElement };
      root.innerHTML = `<div class="modal-backdrop ${drawer ? 'is-drawer' : ''}" data-modal-backdrop>
        <div class="modal ${drawer ? 'modal-drawer' : ''}" role="dialog" aria-modal="true" aria-labelledby="modal-title">
          <div class="modal-head"><div class="min-w-0"><h2 id="modal-title" class="text-lg font-bold leading-snug">${title}</h2>${subtitle ? `<p class="text-sm text-slate-500 mt-1">${subtitle}</p>` : ''}</div>
          <button class="icon-btn -mr-2 -mt-1" data-action="modal-close" aria-label="Fechar">${H.icon('x', 'w-5 h-5')}</button></div>
          <div class="modal-body">${body}</div>${footer ? `<div class="modal-foot">${footer}</div>` : ''}
        </div></div>`;
      document.body.style.overflow = 'hidden';
      UI.icons();
      const first = root.querySelector('[data-autofocus]') || root.querySelector('.modal-body input:not([type=hidden]):not([disabled]), .modal-body select, .modal-body textarea') || root.querySelector('[data-action="modal-close"]');
      if (first) setTimeout(() => first.focus(), 30);
    },
    close(viaConfirm = false) {
      const cur = this.current; this.current = null;
      document.getElementById('modal-root').innerHTML = '';
      document.body.style.overflow = '';
      if (cur && !viaConfirm && cur.onClose) cur.onClose();
      if (cur && cur.lastFocus && cur.lastFocus.isConnected) try { cur.lastFocus.focus({ preventScroll: true }); } catch (e) { /* ok */ }
    },
    isOpen() { return !!this.current; },
  },
  confirm({ title, message, confirmLabel = 'Confirmar', tone = 'primary' }) {
    return new Promise((resolve) => {
      this.modal.open({
        title: H.e(title), body: `<p class="text-[15px] leading-relaxed text-slate-600">${message}</p>`,
        footer: `<button class="btn btn-secondary btn-md" data-action="modal-close">Cancelar</button><button class="btn ${tone === 'danger' ? 'btn-danger-solid' : 'btn-primary'} btn-md" data-action="modal-confirm" data-autofocus>${H.e(confirmLabel)}</button>`,
        onClose: () => resolve(false), onConfirm: () => resolve(true),
      });
    });
  },
  fieldError(form, field, message) {
    const box = form.querySelector('[data-error]');
    form.querySelectorAll('[aria-invalid]').forEach((el) => el.removeAttribute('aria-invalid'));
    if (field) { const el = form.querySelector(`[name="${field}"]`); if (el) { el.setAttribute('aria-invalid', 'true'); el.focus(); } }
    if (box) { box.innerHTML = message ? `<div class="alert alert-crit">${H.icon('circle-alert')}<span>${H.e(message)}</span></div>` : ''; this.icons(); }
  },
};

    <section class="wrap pt-10 sm:pt-12">

        ${st.cameraError ? `<div class="alert alert-warn mt-4">${H.icon('camera-off')}<span>${H.e(st.cameraError)}</span></div>` : ''}
        <div class="mt-4 text-center">${st.showManual ? '' : `<button type="button" class="link-btn text-sm" data-action="toggle-manual">A câmera não funciona? Digite o código</button>`}</div>
        ${st.showManual ? `<form data-form="token" class="mt-4" novalidate>
          <label class="field-label" for="token-input">Código exibido no projetor</label>
          <div class="flex gap-2"><input id="token-input" name="token" class="input mono uppercase tracking-[0.2em] text-center" maxlength="7" placeholder="ABC-234" autocomplete="off" autocapitalize="characters" spellcheck="false">
          <button type="submit" class="btn btn-primary btn-md shrink-0">Validar</button></div>
          <p class="field-hint">O código muda a cada 30 segundos, como o QR Code.</p></form>` : ''}
        <div id="scan-result" class="mt-6" aria-live="polite">${st.result ? this.scanResult(st.result) : ''}</div>
      </div>

      <div class="sim-card mt-6">
        <div class="flex flex-wrap items-center gap-2">${H.icon('flask-conical', 'w-5 h-5 text-indigo-600')}<p class="font-semibold m-0">Simulador de teste</p><span class="badge badge-neutral">sem 2º dispositivo</span></div>
        <p class="text-sm text-slate-600 mt-2 leading-relaxed">Executa a mesma validação da câmera (${H.req('RE04')}) com códigos gerados pelo sistema.</p>
        <div class="grid gap-2.5 mt-4">
          <button type="button" class="btn btn-secondary btn-md justify-start" data-action="sim-valid"><span class="w-2.5 h-2.5 rounded-full bg-emerald-600 shrink-0"></span>Simular Leitura Válida (Token Atual)</button>
          <button type="button" class="btn btn-secondary btn-md justify-start" data-action="sim-expired"><span class="w-2.5 h-2.5 rounded-full bg-orange-500 shrink-0"></span>Simular Token Expirado (&gt; 30s)</button>
          <button type="button" class="btn btn-secondary btn-md justify-start" data-action="sim-unlinked"><span class="w-2.5 h-2.5 rounded-full bg-rose-600 shrink-0"></span>Simular Turma Não Vinculada</button>
        </div>
        <p class="text-xs text-slate-500 mt-3 leading-relaxed">Dica: toque em “Leitura Válida” duas vezes para ver o bloqueio de registro duplicado (RN08).</p>
        ${!openAula ? `<div class="alert alert-info mt-4">${H.icon('info')}<div><p>Nenhuma chamada aberta para suas turmas. A leitura válida precisa de uma aula ativa.</p>${(() => { const dt = Actions._demoTurma(user); return `<button type="button" class="link-btn mt-1" data-action="sim-open-demo">${dt && Repo.aulaAtiva(dt.id) ? 'Reabrir' : 'Abrir'} chamada demo${dt ? ` de ${H.e(Repo.disciplina(dt.disciplinaId).codigo)}` : ''}</button>`; })()}<p class="text-xs mt-1 opacity-80">Atalho de demonstração: executa como o professor da turma.</p></div></div>` : ''}
      </div>
    </section>

    <section class="wrap mt-16" aria-labelledby="freq-title">
      <h2 id="freq-title" class="section-title">Minha frequência</h2>

      <div class="mt-6 space-y-5">${turmas.length ? turmas.map((t) => this.freqCard(user, t)).join('') : `<div class="card-plain">${H.empty('book-open', 'Nenhuma turma vinculada', 'Procure a coordenação para conferir sua matrícula.')}</div>`}</div>

  },
  scanResult(r) {
    const tone = r.ok ? 'ok' : r.reason === 'DUPLICADO' ? 'warn' : 'fail';
    const icon = r.ok ? 'circle-check' : r.reason === 'DUPLICADO' ? 'info' : 'circle-x';
    const via = r.via === 'camera' ? 'Leitura pela câmera' : r.via === 'digitado' ? 'Código digitado' : 'Simulador';
    if (r.ok) {
      const p = r.presenca;
      return `<div class="result result-ok" role="status">
        <div class="flex items-start gap-4"><span class="icon-circle ok">${H.icon(icon)}</span><div class="min-w-0"><p class="text-xl font-bold text-emerald-800 m-0">Presença confirmada</p><p class="text-sm text-slate-600 mt-0.5">${H.e(r.disc.nome)} · turma ${H.e(r.turma.codigo)}</p></div></div>
        <dl class="grid grid-cols-2 gap-x-4 gap-y-3 mt-5 text-sm">
          <div><dt class="text-slate-500">Data</dt><dd class="font-semibold m-0">${Utils.fmtDate(p.registradaEm)}</dd></div>
          <div><dt class="text-slate-500">Hora</dt><dd class="font-semibold mono m-0">${Utils.fmtTime(p.registradaEm, true)}</dd></div>
          <div><dt class="text-slate-500">Disciplina</dt><dd class="font-semibold m-0">${H.e(r.disc.codigo)}</dd></div>
          <div><dt class="text-slate-500">Origem</dt><dd class="m-0">${H.origem('QR_CODE')}</dd></div>
        </dl>
        <p class="text-xs text-slate-500 mt-4">${via} · validado e gravado em ${Utils.fmtSeconds(r.ms)} neste dispositivo (meta: até 2 s, ${H.req('RNF-P01')})</p>
        <details class="disclosure mt-4"><summary>Ver as 4 verificações (RE04) ${H.icon('chevron-down', 'w-4 h-4 chev')}</summary>${H.steps(r.steps)}</details>
      </div>`;
    }
    return `<div class="result result-${tone}" role="alert">
      <div class="flex items-start gap-4"><span class="icon-circle ${tone}">${H.icon(icon)}</span><div class="min-w-0"><p class="text-xl font-bold m-0 ${tone === 'warn' ? 'text-orange-800' : 'text-rose-800'}">${H.e(r.title)}</p><p class="text-sm text-slate-700 mt-1 leading-relaxed">${H.e(r.message)}</p></div></div>
      ${r.hint ? `<p class="text-sm mt-4 flex gap-2 items-start text-slate-700">${H.icon('lightbulb', 'w-4 h-4 mt-0.5 text-slate-500')}<span>${H.e(r.hint)}</span></p>` : ''}
      ${r.note ? `<p class="text-xs text-slate-500 mt-3 leading-relaxed">${H.e(r.note)}</p>` : ''}
      <p class="text-xs text-slate-500 mt-4">${via}${r.simLabel ? ` · ${H.e(r.simLabel)}` : ''}</p>
      <details class="disclosure mt-3" open><summary>Verificações (RE04) ${H.icon('chevron-down', 'w-4 h-4 chev')}</summary>${H.steps(r.steps)}</details>
    </div>`;
  },
  freqCard(user, t) {
    const f = FrequencyCalculator.calc(user.id, t.id);
    const m = FrequencyCalculator.meta[f.status];
    const prof = Repo.user(t.professorId);
    const al = FrequencyCalculator.alert(f, 'aluno');
    return `<article class="card card-click" role="button" tabindex="0" data-action="open-history" data-turma="${t.id}" aria-label="Ver histórico de ${H.e(f.disc.nome)}">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0"><p class="mono text-xs font-semibold text-indigo-600 m-0">${H.e(f.disc.codigo)} · ${H.e(t.codigo)}</p><h3 class="text-lg font-bold tracking-tight mt-1 mb-0">${H.e(f.disc.nome)}</h3><p class="text-sm text-slate-500 mt-0.5">${H.e(prof ? prof.nome : 'Professor não definido')}</p></div>
        ${H.statusBadge(f.status)}
      </div>
      <div class="flex items-end justify-between gap-3 mt-6"><p class="m-0 leading-none"><span class="text-[44px] font-extrabold tracking-tight text-slate-900">${Utils.fmtPctNum(f.pct)}</span>${f.pct !== null ? '<span class="text-2xl font-bold text-slate-900">%</span>' : ''}</p><p class="text-sm text-slate-500 m-0 pb-1">mínimo 75%</p></div>
      <div class="mt-3">${H.meter(f.pct, m.fill, { label: `Frequência ${Utils.fmtPct(f.pct)}, mínimo 75%` })}</div>
      <div class="grid grid-cols-3 gap-3 mt-6">
        <div class="stat"><p class="stat-value">${f.presencas}</p><p class="stat-label">Presenças</p></div>
        <div class="stat"><p class="stat-value">${f.faltas}</p><p class="stat-label">Faltas</p></div>
        <div class="stat"><p class="stat-value">${Math.max(0, f.restantes)}</p><p class="stat-label">Faltas restantes de ${f.limite}</p></div>
      </div>
      ${al ? `<div class="alert alert-${al.tone} mt-5">${H.icon(al.tone === 'crit' ? 'circle-alert' : 'triangle-alert')}<div><p class="font-semibold">${H.e(al.title)} ${H.req('RN11')}</p><p>${H.e(al.text)}</p></div></div>` : ''}
      <div class="flex items-center justify-between gap-3 mt-5 text-xs text-slate-500"><span>Sobre ${f.realizadas} aulas encerradas de ${f.previstas} previstas ${H.req('RN10')}</span><span class="inline-flex items-center gap-1 text-indigo-600 font-semibold text-sm shrink-0">Histórico ${H.icon('chevron-right', 'w-4 h-4')}</span></div>
    </article>`;
  },
  historyDrawer(user, turmaId) {
    const t = Repo.turma(turmaId); const f = FrequencyCalculator.calc(user.id, t.id); const prof = Repo.user(t.professorId);
    const aulas = Repo.aulasDaTurma(t.id).slice().reverse();
    const rows = aulas.map((a) => {
      const p = Repo.presenca(a.id, user.id);
      const aj = Repo.ajustesDoAluno(a.id, user.id)[0];
      let status, detail = '';
      if (p) {
        status = '<span class="badge badge-ok">Presente</span>';
        if (p.origem === 'AJUSTE_MANUAL') { const autor = Repo.user(p.ajustadaPor); detail = `<p class="text-xs text-slate-500 mt-1">Ajuste manual por ${H.e(autor ? autor.nome : '—')} em ${Utils.fmtDateTime(p.registradaEm)}</p><p class="text-xs text-slate-600 mt-1 italic">“${H.e(p.justificativa)}”</p>`; }
        else detail = `<p class="text-xs text-slate-500 mt-1">Registrado às <span class="mono">${Utils.fmtTime(p.registradaEm, true)}</span> pela leitura do QR Code</p>`;
      } else if (a.status === 'ATIVA') { status = '<span class="badge badge-warn">Em andamento</span>'; detail = '<p class="text-xs text-slate-500 mt-1">Chamada aberta: registre sua presença agora.</p>'; }
      else {
        status = '<span class="badge badge-crit">Falta</span>';
        if (aj && aj.acao === 'FALTA') { const autor = Repo.user(aj.autorId); detail = `<p class="text-xs text-slate-500 mt-1">Presença removida por ajuste manual de ${H.e(autor ? autor.nome : '—')} em ${Utils.fmtDateTime(aj.em)}</p><p class="text-xs text-slate-600 mt-1 italic">“${H.e(aj.justificativa)}”</p>`; }
      }
      return `<li class="row items-start"><div class="date-col pt-0.5"><p class="wd m-0">${Utils.fmtWeekday(a.iniciadaEm)}</p><p class="dm m-0">${Utils.fmtDayMonth(a.iniciadaEm)}</p></div>
        <div class="flex-1 min-w-0"><div class="flex flex-wrap items-center gap-2"><p class="font-semibold text-sm m-0">Aula ${a.numero} · ${Utils.fmtTime(a.iniciadaEm)}</p>${p ? H.origem(p.origem) : ''}</div>${detail}</div>${status}</li>`;
    }).join('');
    UI.modal.open({
      drawer: true,
      title: `${H.e(f.disc.nome)} <span class="mono text-sm font-semibold text-indigo-600">${H.e(f.disc.codigo)}</span>`,
      subtitle: `Turma ${H.e(t.codigo)} · ${H.e(prof ? prof.nome : '')} · semestre ${CONFIG.SEMESTRE.codigo}`,
      body: `<div class="grid grid-cols-3 gap-2.5"><div class="stat"><p class="stat-value">${Utils.fmtPct(f.pct)}</p><p class="stat-label">Frequência</p></div><div class="stat"><p class="stat-value">${f.presencas}/${f.faltas}</p><p class="stat-label">Presenças / faltas</p></div><div class="stat"><p class="stat-value">${Math.max(0, f.restantes)}</p><p class="stat-label">Faltas restantes</p></div></div>
        <p class="text-xs text-slate-500 mt-3">Dados da aula e origem de cada registro ${H.req('RF20')} · você só vê o próprio histórico ${H.req('RNF12')}</p>
        <ul class="list-card mt-4">${rows || `<li>${H.empty('calendar', 'Nenhuma aula ainda', 'As aulas aparecem aqui assim que o professor iniciar a chamada.')}</li>`}</ul>`,
    });
  },

  /* ------------------------------------------------- TELA 3 · Professor */
  professor(user, route) {
    const tab = route.params[0] || 'turmas';
    if (tab === 'chamada') return this.chamada(user, route.params[1]);
    const turmas = Repo.turmasDoProfessor(user.id);
    const ativas = turmas.map((t) => Repo.aulaAtiva(t.id)).filter(Boolean);
    const alertCount = turmas.reduce((n, t) => n + t.alunoIds.filter((id) => FrequencyCalculator.calc(id, t.id).status === 'critico').length, 0);
    let content = '';
    if (tab === 'historico') content = this.profHistorico(user, turmas);
    else if (tab === 'frequencia') content = this.profFrequencia(user, turmas);
    else content = this.profTurmas(user, turmas);
    const hour = new Date().getHours();
    const greet = hour < 12 ? 'Bom dia' : hour < 18 ? 'Boa tarde' : 'Boa noite';
    return `<section class="wrap pt-10 sm:pt-12">
      <p class="eyebrow">Área do professor</p>
      <h1 class="page-title mt-2">${greet}, ${H.e(Utils.firstName(user.nome))}</h1>
      <p class="text-[17px] text-slate-600 mt-2">${Utils.plural(turmas.length, 'turma vinculada', 'turmas vinculadas')} · semestre ${CONFIG.SEMESTRE.codigo}</p>
      ${ativas.map((a) => { const { turma, disc } = Repo.ctx(a); const n = Repo.presencasDaAula(a.id).length; return `<div class="alert alert-warn mt-6 items-center">${H.icon('radio')}<div class="flex-1 min-w-0"><p class="font-semibold">Chamada em andamento: ${H.e(disc.codigo)} · ${H.e(turma.codigo)}</p><p>${n} de ${turma.alunoIds.length} presentes</p></div><a class="btn btn-primary btn-sm shrink-0" href="#/professor/chamada/${a.id}">Abrir</a></div>`; }).join('')}
      <div class="mt-8">${this.tabs([
        ['turmas', 'Minhas turmas', '#/professor/turmas', turmas.length],
        ['historico', 'Histórico e ajustes', '#/professor/historico', null],
        ['frequencia', 'Frequência', '#/professor/frequencia', alertCount || null],
      ], tab)}</div>
      <div class="mt-8">${content}</div>
    </section>`;
  },
  tabs(items, active) {
    return `<nav class="tabs" aria-label="Seções">${items.map(([key, label, href, count]) => `<a href="${href}" class="tab ${key === active ? 'is-active' : ''}" ${key === active ? 'aria-current="page"' : ''}>${label}${count != null ? `<span class="tab-count">${count}</span>` : ''}</a>`).join('')}</nav>`;
  },
  profTurmas(user, turmas) {
    if (!turmas.length) return `<div class="card-plain">${H.empty('book-open', 'Nenhuma turma vinculada', 'A coordenação vincula professores às turmas na área do administrador (RF05).')}</div>`;
    return `<div class="space-y-5">${turmas.map((t) => {
      const disc = Repo.disciplina(t.disciplinaId); const ativa = Repo.aulaAtiva(t.id);
      const realizadas = Repo.aulasDaTurma(t.id).filter((a) => a.status === 'ENCERRADA').length;
      const fs = t.alunoIds.map((id) => FrequencyCalculator.calc(id, t.id));
      const crit = fs.filter((f) => f.status === 'critico').length, warn = fs.filter((f) => f.status === 'atencao').length;
      return `<article class="card">
        <div class="flex items-start justify-between gap-3"><div class="min-w-0"><p class="mono text-xs font-semibold text-indigo-600 m-0">${H.e(disc.codigo)} · ${H.e(t.codigo)}</p><h3 class="text-lg font-bold tracking-tight mt-1 mb-0">${H.e(disc.nome)}</h3>
          <p class="text-sm text-slate-500 mt-0.5">${Utils.plural(t.alunoIds.length, 'aluno', 'alunos')} · ${realizadas} de ${disc.aulasPrevistas} aulas realizadas</p></div>
          ${ativa ? `<span class="badge badge-warn"><span class="live-dot" style="margin-top:0"></span>Ao vivo</span>` : ''}</div>
        ${crit || warn ? `<div class="flex flex-wrap gap-2 mt-4">${crit ? `<span class="badge badge-crit">${H.icon('circle-alert')}${Utils.plural(crit, 'aluno', 'alunos')} abaixo de 75% ou no limite</span>` : ''}${warn ? `<span class="badge badge-warn">${H.icon('triangle-alert')}${Utils.plural(warn, 'aluno', 'alunos')} em atenção</span>` : ''}<span class="req self-center">RN11</span></div>` : ''}
        <div class="mt-6">${ativa
          ? `<a class="btn btn-primary btn-lg" href="#/professor/chamada/${ativa.id}">${H.icon('qr-code', 'w-5 h-5')} Retomar chamada ativa</a>`
          : `<div class="flex items-center justify-between gap-3 mb-3"><label class="text-sm font-medium text-slate-700" for="val-${t.id}">Validade da chamada ${H.req('RN05')}</label><select id="val-${t.id}" class="input input-sm w-[112px]">${H.validadeOptions(CONFIG.VALIDADE_PADRAO)}</select></div>
             <button type="button" class="btn btn-primary btn-lg" data-action="start-aula" data-turma="${t.id}">${H.icon('qr-code', 'w-5 h-5')} Iniciar Aula e Gerar QR Code</button>`}</div>
      </article>`;
    }).join('')}</div>`;
  },
  chamada(user, aulaId) {
    const back = `<a href="#/professor/turmas" class="back-link">${H.icon('arrow-left')} Minhas turmas</a>`;
    const aula = Repo.aula(aulaId);
    if (!aula) return `<section class="wrap pt-10">${back}<div class="card-plain mt-6">${H.empty('search-x', 'Aula não encontrada', 'Ela pode ter sido apagada ao resetar os dados demo.')}</div></section>`;
    const { turma, disc } = Repo.ctx(aula);
    if (!turma || turma.professorId !== user.id) return `<section class="wrap pt-10">${back}<div class="card-plain mt-6">${H.empty('lock', 'Aula de outra turma', 'Você só acessa aulas das turmas vinculadas ao seu perfil (RNF05).')}</div></section>`;
    if (aula.status !== 'ATIVA') return `<section class="wrap pt-10">${back}<div class="card mt-6 text-center">${H.icon('circle-check', 'w-10 h-10 mx-auto text-emerald-600')}<p class="text-xl font-bold mt-4">Chamada encerrada</p><p class="text-slate-600 mt-1">Encerrada em ${Utils.fmtDateTime(aula.encerradaEm)}. ${Repo.presencasDaAula(aula.id).length} de ${turma.alunoIds.length} presentes.</p><a class="btn btn-secondary btn-md mt-6" href="#/professor/historico">Ver histórico e ajustes</a></div></section>`;
    const now = Date.now(); const open = QRCodeEngine.windowOpen(aula, now);
    const pres = Repo.presencasDaAula(aula.id).sort((a, b) => b.registradaEm - a.registradaEm);
    const alunos = turma.alunoIds.map((id) => Repo.user(id)).filter(Boolean);
    const presentIds = new Set(pres.map((p) => p.alunoId));
    const ausentes = alunos.filter((a) => !presentIds.has(a.id));
    const seenKey = aula.id; const firstView = !ui.prof.seen[seenKey];
    const seen = ui.prof.seen[seenKey] || (ui.prof.seen[seenKey] = new Set());
    const listRows = pres.map((p) => {
      const u = Repo.user(p.alunoId); const isNew = !firstView && !seen.has(p.id); seen.add(p.id);
      return `<li class="row ${isNew ? 'flash' : ''}">${H.avatar(u, 'sm')}<div class="flex-1 min-w-0"><p class="font-semibold text-sm truncate m-0">${H.e(u ? u.nome : 'Aluno removido')}</p><p class="text-xs text-slate-500 m-0">Registrado às <span class="mono">${Utils.fmtTime(p.registradaEm, true)}</span></p></div>${H.origemLabel(p.origem)}</li>`;
    }).join('');
    const pct = alunos.length ? (pres.length / alunos.length) * 100 : 0;
    return `<section class="wrap pt-8 sm:pt-10">
      ${back}
      <div class="mt-5"><p class="mono text-xs font-semibold text-indigo-600 m-0">${H.e(disc.codigo)} · ${H.e(turma.codigo)} · Aula ${aula.numero}</p>
        <h1 class="page-title mt-1.5">${H.e(disc.nome)}</h1>
        <p class="text-sm text-slate-600 mt-2 flex flex-wrap items-center gap-x-2">${H.icon('clock', 'w-4 h-4 text-slate-400')} Iniciada às ${Utils.fmtTime(aula.iniciadaEm)} · em andamento há <span class="mono font-semibold" data-elapsed-from="${aula.iniciadaEm}">--:--</span></p></div>

  profHistorico(user, turmas) {

    const aulas = StateManager.get().aulas.filter((a) => ids.has(a.turmaId) && a.status === 'ENCERRADA').sort((a, b) => b.iniciadaEm - a.iniciadaEm);
    const shown = aulas.slice(0, ui.prof.histLimit);
    const rows = shown.map((a) => {
      const { turma } = Repo.ctx(a); const n = Repo.presencasDaAula(a.id).length; const nAj = Repo.ajustesDaAula(a.id).length;
      const pz = AttendanceValidator.prazo(a, now);
      const action = pz.ok
        ? `<button type="button" class="btn btn-secondary btn-sm" data-action="open-adjust" data-aula="${a.id}">${H.icon('square-pen')} Ajustar Presença</button>`
        : `<span class="btn btn-locked btn-sm" aria-disabled="true" title="Prazo de 7 dias encerrado em ${Utils.fmtDate(pz.limite)} (RN12)">${H.icon('lock')} Prazo encerrado</span>`;
      return `<li class="row flex-wrap sm:flex-nowrap"><div class="date-col"><p class="wd m-0">${Utils.fmtWeekday(a.iniciadaEm)}</p><p class="dm m-0">${Utils.fmtDayMonth(a.iniciadaEm)}</p></div>

        <div class="w-full sm:w-auto flex justify-end">${action}</div></li>`;
    }).join('');
    return `<div class="flex flex-wrap items-end justify-between gap-3"><div><h2 class="section-title">Aulas encerradas ${H.req('RF13 · RF15')}</h2><p class="text-sm text-slate-500 mt-1">Ajustes com justificativa obrigatória, até 7 dias corridos após a aula ${H.req('RN12')}</p></div>

      <ul class="list-card mt-5">${rows || `<li>${H.empty('history', 'Nenhuma aula encerrada', 'As aulas aparecem aqui depois que você encerra a chamada.')}</li>`}</ul>
      ${aulas.length > shown.length ? `<button type="button" class="btn btn-ghost btn-md w-full mt-3" data-action="hist-more">Mostrar mais aulas (${aulas.length - shown.length} restantes)</button>` : ''}`;
  },
  profFrequencia(user, turmas) {
    if (!turmas.length) return `<div class="card-plain">${H.empty('chart-column', 'Sem turmas', 'Nenhuma turma vinculada ao seu perfil.')}</div>`;
    const turmaId = turmas.some((t) => t.id === ui.prof.freqTurma) ? ui.prof.freqTurma : turmas[0].id;
    const rows = ReportExporter.rows({ turmaId, professorId: user.id });
    const comDados = rows.filter((r) => r.pct !== null); const media = comDados.length ? comDados.reduce((s, r) => s + r.pct, 0) / comDados.length : null;
    const crit = rows.filter((r) => r.status === 'critico').length, warn = rows.filter((r) => r.status === 'atencao').length;
    return `<div class="flex flex-wrap items-end justify-between gap-3"><h2 class="section-title">Frequência da turma ${H.req('RF13 · RN11')}</h2>
      <select id="freq-turma" class="input input-sm w-auto" data-change="freq-turma" aria-label="Escolher turma">${turmas.map((t) => `<option value="${t.id}" ${t.id === turmaId ? 'selected' : ''}>${H.e(t.codigo)}</option>`).join('')}</select></div>

      <ul class="list-card mt-5">${rows.map((r) => `<li class="row items-start">${H.avatar(r.aluno, 'sm')}<div class="flex-1 min-w-0"><div class="flex items-center justify-between gap-2"><p class="font-semibold text-sm truncate m-0">${H.e(r.aluno.nome)}${r.aluno.ativo ? '' : ' <span class="badge badge-neutral ml-1">Inativo</span>'}</p><p class="text-base font-bold m-0 tabular">${Utils.fmtPct(r.pct)}</p></div>
        <div class="mt-2">${H.meter(r.pct, FrequencyCalculator.meta[r.status].fill, { thin: true })}</div>
        <div class="flex flex-wrap items-center justify-between gap-2 mt-2"><p class="text-xs text-slate-500 m-0">${r.presencas} presenças · ${r.faltas} faltas · ${Math.max(0, r.restantes)} de ${r.limite} restantes</p>${H.statusBadge(r.status)}</div></div></li>`).join('')}</ul>
      <div class="grid sm:grid-cols-2 gap-3 mt-6"><button type="button" class="btn btn-primary btn-lg" data-action="export-turma" data-turma="${turmaId}">${H.icon('file-down', 'w-5 h-5')} Exportar CSV da turma</button><button type="button" class="btn btn-secondary btn-lg" data-action="print-turma" data-turma="${turmaId}">${H.icon('printer', 'w-5 h-5')} Imprimir / Salvar PDF</button></div>
      <p class="text-xs text-slate-500 mt-3">O relatório traz somente as suas turmas ${H.req('RNF08 · RE09')}</p>`;

  adjustModal(user, aulaId, alunoId = null, error = null) {

        <fieldset><legend class="field-label">O que fazer</legend><div class="grid sm:grid-cols-2 gap-2.5">
          <label class="radio-card"><input type="radio" name="acao" value="PRESENCA" ${present ? 'disabled' : 'checked'}><span><span class="block font-semibold text-sm">Lançar presença</span><span class="block text-xs text-slate-500 mt-0.5">Origem AJUSTE_MANUAL</span></span></label>
          <label class="radio-card"><input type="radio" name="acao" value="FALTA" ${present ? 'checked' : 'disabled'}><span><span class="block font-semibold text-sm">Registrar falta</span><span class="block text-xs text-slate-500 mt-0.5">Remove a presença atual</span></span></label>

        <fieldset><legend class="field-label">Alunos vinculados</legend><div class="space-y-2">${alunos.map((a) => `<label class="check-row"><input type="checkbox" name="alunos" value="${a.id}" ${t.alunoIds.includes(a.id) ? 'checked' : ''}>${H.avatar(a, 'xs')}<span class="flex-1 min-w-0"><span class="block text-sm font-medium truncate">${H.e(a.nome)}</span><span class="block text-xs text-slate-500 truncate">${H.e(a.email)}${a.ativo ? '' : ' · inativo'}</span></span></label>`).join('') || '<p class="text-sm text-slate-500">Nenhum aluno cadastrado.</p>'}</div></fieldset>

/* =================================================================== ACTIONS */
const Actions = {
  'toggle-menu'() { ui.menuOpen = !ui.menuOpen; UI.render(); if (ui.menuOpen) { const f = document.querySelector('.menu-panel .menu-item'); if (f) f.focus(); } },
  'switch-user'(el) {
    ui.menuOpen = false;
    const r = AuthService.loginAs(el.dataset.user);
    if (!r.ok) { UI.toast(r.message, 'error', 'Acesso bloqueado'); UI.render(); return; }
    ui.student = { result: null, scanning: false, starting: false, cameraError: null, showManual: false };
    CameraScanner.stop();
    UI.toast(`Agora você está como ${Utils.firstName(r.user.nome)} (${AuthService.perfilLabel(r.user.perfil)}).`, 'info');
    Router.go(AuthService.homeFor(r.user));
  },
  logout() { ui.menuOpen = false; CameraScanner.stop(); ui.student.scanning = false; AuthService.logout(); ui.login = { error: null }; UI.toast('Você saiu da sua conta.', 'info'); Router.go('#/'); },
  async 'reset-demo'() {
    ui.menuOpen = false; UI.render();
    const ok = await UI.confirm({ title: 'Resetar dados de demonstração?', message: 'Todas as alterações feitas neste navegador (cadastros, presenças, ajustes) serão apagadas e a base original será recriada com datas a partir de hoje.', confirmLabel: 'Resetar dados', tone: 'danger' });
    if (!ok) return;
    CameraScanner.stop(); AuthService.logout();
    ui.student = { result: null, scanning: false, starting: false, cameraError: null, showManual: false }; ui.prof.seen = {}; ui.projection = null; ui.login = { error: null };
    StateManager.reset();
    UI.toast('Dados de demonstração restaurados.', 'ok');
    Router.go('#/');
  },
  'toggle-password'(el) {
    const input = document.getElementById('login-senha'); if (!input) return;
    const show = input.type === 'password'; input.type = show ? 'text' : 'password';
    el.setAttribute('aria-pressed', String(show)); el.setAttribute('aria-label', show ? 'Ocultar senha' : 'Mostrar senha');
    el.innerHTML = H.icon(show ? 'eye-off' : 'eye', 'w-5 h-5'); UI.icons(); input.focus();
  },
  'quick-login'(el) {
    const r = AuthService.loginAs(el.dataset.user);
    if (!r.ok) { ui.login = { error: r.message, code: r.code }; UI.render(); return; }
    ui.login = { error: null };
    UI.toast(`Bem-vindo(a), ${Utils.firstName(r.user.nome)}!`, 'ok');
    Router.go(AuthService.homeFor(r.user));
  },
  'demo-inactive'() {
    const u = Repo.users().find((x) => !x.ativo);
    if (!u) { UI.toast('Não há usuários inativos agora. Desative alguém na área do administrador.', 'info'); return; }
    const em = document.getElementById('login-email'), pw = document.getElementById('login-senha');
    if (em) em.value = u.email; if (pw) pw.value = CONFIG.DEMO_PASSWORD;
    const form = document.querySelector('form[data-form="login"]'); if (form) Forms.login(form);
  },
  home() { Router.go(AuthService.homeFor(AuthService.currentUser())); },

  /* Aluno */
  async 'scan-start'() {
    const st = ui.student; st.cameraError = null; st.result = null;
    if (!CameraScanner.supported()) { st.cameraError = CameraScanner.message({ name: 'UNSUPPORTED' }); st.showManual = true; UI.render(); return; }
    st.scanning = true; st.starting = true; UI.render();
    try { await CameraScanner.start((text) => Actions.onScan(text)); st.starting = false; if (st.scanning) UI.render(); else CameraScanner.stop(); }
    catch (err) { CameraScanner.stop(); st.scanning = false; st.starting = false; st.cameraError = CameraScanner.message(err); st.showManual = true; UI.render(); }
  },
  'scan-stop'() { CameraScanner.stop(); ui.student.scanning = false; ui.student.starting = false; UI.render(); },
  onScan(text) {
    if (!ui.student.scanning) return;
    CameraScanner.stop(); ui.student.scanning = false;
    const user = AuthService.currentUser(); if (!user) return;
    const parsed = QRCodeEngine.parse(text);
    let r;
    if (!parsed) {
      r = AttendanceValidator.failAt(0, { reason: 'FORMATO', title: 'QR Code não reconhecido', message: 'Este QR Code não foi gerado pelo PresençaQR.', hint: 'Aponte a câmera para o código projetado pelo professor.' });
    } else {
      r = AttendanceValidator.register({ token: parsed.token, aulaId: parsed.aulaId, alunoId: user.id });
      if (!r.ok && r.reason === 'TOKEN_DESCONHECIDO' && !Repo.aula(parsed.aulaId)) r.note = 'Este protótipo não tem servidor: os dados ficam no navegador. Para validar com a câmera, professor e aluno precisam usar o mesmo navegador. Na versão final, a validação acontece no backend.';
    }
    Actions.showResult({ ...r, via: 'camera' });
  },
  showResult(r) {
    ui.student.result = r;
    try { if (navigator.vibrate) navigator.vibrate(r.ok ? 80 : [60, 40, 60]); } catch (e) { /* opcional */ }
    UI.render();
    const el = document.getElementById('scan-result'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  },
  'toggle-manual'() { ui.student.showManual = true; UI.render(); const i = document.getElementById('token-input'); if (i) i.focus(); },
  /** Turma usada pelo atalho de demonstração: a que já tem aula ativa (reabre), senão a primeira. */
  _demoTurma(user) { const ts = Repo.turmasDoAluno(user.id); return ts.find((t) => Repo.aulaAtiva(t.id)) || ts[0] || null; },
  _openAulaFor(user) { const now = Date.now(); return Repo.turmasDoAluno(user.id).map((t) => Repo.aulaAtiva(t.id)).find((a) => a && QRCodeEngine.windowOpen(a, now)) || null; },
  'sim-valid'() {
    const user = AuthService.currentUser(); const aula = Actions._openAulaFor(user);
    if (!aula) { UI.toast('Nenhuma chamada aberta para suas turmas. Use “Abrir chamada demo”.', 'warn'); return; }
    const tok = QRCodeEngine.ensureCurrent(aula.id);
    const r = AttendanceValidator.register({ token: tok.token, aulaId: aula.id, alunoId: user.id });
    Actions.showResult({ ...r, via: 'sim', simLabel: `token atual ${Utils.fmtToken(tok.token)}` });
  },
  'sim-expired'() {
    const user = AuthService.currentUser(); const now = Date.now();
    const turmaIds = new Set(Repo.turmasDoAluno(user.id).map((t) => t.id));
    const aulaIds = new Set(StateManager.get().aulas.filter((a) => turmaIds.has(a.turmaId)).map((a) => a.id));
    const open = Actions._openAulaFor(user);
    const expired = StateManager.get().qrcodes.filter((q) => aulaIds.has(q.aulaId) && q.expiraEm <= now).sort((a, b) => (open && (a.aulaId === open.id) !== (b.aulaId === open.id) ? (a.aulaId === open.id ? -1 : 1) : b.expiraEm - a.expiraEm))[0];
    if (!expired) { UI.toast('Ainda não há código expirado para testar. Aguarde 30 segundos após abrir a chamada.', 'info'); return; }
    const r = AttendanceValidator.register({ token: expired.token, aulaId: expired.aulaId, alunoId: user.id });
    Actions.showResult({ ...r, via: 'sim', simLabel: `código ${Utils.fmtToken(expired.token)} gerado às ${Utils.fmtTime(expired.geradoEm, true)}` });
  },
  'sim-unlinked'() {
    const user = AuthService.currentUser(); const now = Date.now();
    const outras = Repo.turmas().filter((t) => !t.alunoIds.includes(user.id));
    const realOpen = outras.map((t) => Repo.aulaAtiva(t.id)).find((a) => a && QRCodeEngine.windowOpen(a, now));
    let r, label;
    if (realOpen) {
      const tok = QRCodeEngine.ensureCurrent(realOpen.id);
      r = AttendanceValidator.register({ token: tok.token, aulaId: realOpen.id, alunoId: user.id });
      label = `QR Code real da turma ${Repo.turma(realOpen.turmaId).codigo}`;
    } else {
      // Sala vizinha simulada (não é gravada): uma aula ativa de uma turma à qual o aluno não pertence.
      const turma = outras[0] || { id: 'sandbox-turma', codigo: 'OUT-000', disciplinaId: (StateManager.get().disciplinas[0] || {}).id, alunoIds: [], professorId: null };
      const aula = { id: 'sandbox-aula', turmaId: turma.id, numero: 1, status: 'ATIVA', iniciadaEm: now - 60000, chamadaExpiraEm: now + 600000, _sandbox: true };
      const qr = { id: 'sandbox-qr', aulaId: aula.id, token: Utils.randomToken(), geradoEm: now - 4000, expiraEm: now + 26000 };
      r = AttendanceValidator.register({ token: qr.token, aulaId: aula.id, alunoId: user.id, sandbox: { aulas: [aula], qrcodes: [qr], turmas: outras[0] ? [] : [turma] } });
      label = `QR Code projetado na sala da turma ${turma.codigo}`;
    }
    Actions.showResult({ ...r, via: 'sim', simLabel: label });
  },
  'sim-open-demo'() {
    const user = AuthService.currentUser(); const t = Actions._demoTurma(user);
    if (!t) { UI.toast('Você não está vinculado a nenhuma turma.', 'warn'); return; }
    const ativa = Repo.aulaAtiva(t.id);
    const r = ativa ? QRCodeEngine.setValidade(ativa.id, CONFIG.VALIDADE_PADRAO) : QRCodeEngine.startAula(t.id, CONFIG.VALIDADE_PADRAO, t.professorId);
    if (!r.ok) { UI.toast(r.message, 'error'); return; }
    UI.toast(`Chamada demo aberta em ${Repo.disciplina(t.disciplinaId).codigo} por ${CONFIG.VALIDADE_PADRAO} min.`, 'ok');
    UI.render();
  },
  'open-history'(el) { const u = AuthService.currentUser(); if (u) Views.historyDrawer(u, el.dataset.turma); },

  /* Professor */
  'start-aula'(el) {
    const user = AuthService.currentUser(); const sel = document.getElementById(`val-${el.dataset.turma}`);
    const r = QRCodeEngine.startAula(el.dataset.turma, sel ? Number(sel.value) : CONFIG.VALIDADE_PADRAO, user.id);
    if (!r.ok) { UI.toast(r.message, 'error'); return; }
    UI.toast(`Aula iniciada. QR Code válido por ${r.aula.validadeMin} min, renovado a cada 30 s.`, 'ok');
    Router.go(`#/professor/chamada/${r.aula.id}`);
  },
  'projection-on'(el) { UI.enterProjection(el.dataset.aula); },
  'projection-off'() { UI.exitProjection(); },
  reopen(el) {
    const sel = document.getElementById(`reopen-${el.dataset.aula}`);
    const r = QRCodeEngine.setValidade(el.dataset.aula, sel ? Number(sel.value) : 5);
    if (!r.ok) { UI.toast(r.message, 'error'); return; }
    UI.toast(`Novo QR Code gerado. Leituras aceitas até ${Utils.fmtTime(r.aula.chamadaExpiraEm)}.`, 'ok'); UI.render();
  },
  async 'end-aula'(el) {
    const user = AuthService.currentUser(); const aula = Repo.aula(el.dataset.aula); if (!aula) return;
    const { turma } = Repo.ctx(aula); const n = Repo.presencasDaAula(aula.id).length; const tot = turma.alunoIds.length;
    const ok = await UI.confirm({ title: 'Encerrar a chamada?', message: `${n} de ${tot} alunos têm presença registrada. ${tot - n > 0 ? `Os ${tot - n} restantes ficarão com falta nesta aula.` : 'Toda a turma está presente.'} O QR Code deixa de aceitar leituras imediatamente (RE05). Você ainda poderá fazer ajustes por 7 dias.`, confirmLabel: 'Encerrar chamada', tone: 'danger' });
    if (!ok) return;
    const r = QRCodeEngine.endAula(aula.id, user.id);
    if (!r.ok) { UI.toast(r.message, 'error'); return; }
    if (ui.projection === aula.id) UI.exitProjection();
    UI.toast(`Chamada encerrada: ${Utils.plural(n, 'presença', 'presenças')} e ${Utils.plural(tot - n, 'falta', 'faltas')}. Frequência da turma recalculada (RE06).`, 'ok');
    Router.go('#/professor/historico');
  },
  'open-adjust'(el) { const u = AuthService.currentUser(); const aula = Repo.aula(el.dataset.aula); if (!aula) return; if (!AttendanceValidator.prazo(aula).ok) { UI.toast('O prazo de 7 dias para ajustes desta aula terminou (RN12).', 'warn'); return; } Views.adjustModal(u, el.dataset.aula, el.dataset.aluno || null); },
  'hist-more'() { ui.prof.histLimit += 20; UI.render(); },
  'export-turma'(el) { ReportExporter.exportCSV({ turmaId: el.dataset.turma, professorId: AuthService.currentUser().id }); },
  'print-turma'(el) { const u = AuthService.currentUser(); const t = Repo.turma(el.dataset.turma); ReportExporter.print({ turmaId: el.dataset.turma, professorId: u.id }, { filtro: `Turma ${t.codigo}`, emissor: u.nome }); },

  /* Admin */
  async 'toggle-user'(el) {
    const me = AuthService.currentUser(); const u = Repo.user(el.dataset.user); if (!u) return;
    if (u.id === me.id) { UI.toast('Você não pode desativar a própria conta.', 'warn'); return; }
    if (u.ativo) { const ok = await UI.confirm({ title: `Desativar ${Utils.firstName(u.nome)}?`, message: `${Utils.esc(u.nome)} não conseguirá mais entrar no sistema (RN01). O histórico de frequência é mantido e a conta pode ser reativada a qualquer momento.`, confirmLabel: 'Desativar acesso', tone: 'danger' }); if (!ok) return; }
    const ativo = StateManager.update((s) => { const x = s.users.find((y) => y.id === u.id); x.ativo = !x.ativo; return x.ativo; });
    UI.toast(ativo ? `${u.nome} foi reativado(a). O login já está liberado.` : `${u.nome} foi desativado(a). O login está bloqueado (RN01).`, ativo ? 'ok' : 'warn');
  },
  'edit-user'(el) { Views.editUserModal(el.dataset.user); },
  'edit-disc'(el) { Views.editDiscModal(el.dataset.disc); },
  'manage-turma'(el) { Views.manageTurmaModal(el.dataset.turma); },
  'export-csv'() { ReportExporter.exportCSV(ui.admin.report); },
  'print-report'() {
    const f = ui.admin.report; const t = f.turmaId !== 'all' ? Repo.turma(f.turmaId) : null;
    const filtro = `Turma: ${t ? t.codigo : 'todas'} · Situação: ${f.status === 'all' ? 'todas' : FrequencyCalculator.meta[f.status].label}${f.q ? ` · Busca: “${f.q}”` : ''}`;
    ReportExporter.print(f, { filtro, emissor: AuthService.currentUser().nome });
  },

  /* Modal */
  'modal-close'() { UI.modal.close(); },
  'modal-confirm'() { const cur = UI.modal.current; UI.modal.close(true); if (cur && cur.onConfirm) cur.onConfirm(); },
};

/* ===================================================================== FORMS */
const Forms = {
  login(form) {
    const fd = new FormData(form);
    const r = AuthService.login(fd.get('email'), fd.get('senha'));
    if (!r.ok) {
      ui.login = { error: r.message, code: r.code, field: r.field || null };
      UI.render();
      const target = document.getElementById(r.field === 'email' ? 'login-email' : 'login-senha'); if (target && r.code !== 'INACTIVE') target.focus();
      return;
    }
    ui.login = { error: null };
    UI.toast(`Bem-vindo(a), ${Utils.firstName(r.user.nome)}!`, 'ok');
    Router.go(AuthService.homeFor(r.user));
  },
  token(form) {
    const user = AuthService.currentUser();
    const token = QRCodeEngine.normalizeTyped(new FormData(form).get('token'));
    if (token.length !== 6) { UI.toast('O código tem 6 caracteres, como ABC-234.', 'warn'); return; }
    const r = AttendanceValidator.register({ token, alunoId: user.id });
    form.reset();
    Actions.showResult({ ...r, via: 'digitado' });
  },
  'new-user'(form) {
    const fd = new FormData(form);
    const nome = String(fd.get('nome') || '').trim().replace(/\s+/g, ' ');
    const email = String(fd.get('email') || '').trim().toLowerCase();
    const perfil = fd.get('perfil'); const senha = String(fd.get('senha') || '') || CONFIG.DEMO_PASSWORD;
    if (nome.length < 5 || !nome.includes(' ')) return UI.fieldError(form, 'nome', 'Informe o nome completo (nome e sobrenome).');
    if (!Utils.isEmail(email)) return UI.fieldError(form, 'email', 'Informe um e-mail válido, como nome@alunos.umc.br.');
    if (Repo.userByEmail(email)) return UI.fieldError(form, 'email', 'Já existe um usuário com este e-mail.');
    if (!['ALUNO', 'PROFESSOR', 'ADMIN'].includes(perfil)) return UI.fieldError(form, 'perfil', 'Escolha um perfil.');
    if (senha.length < 6) return UI.fieldError(form, 'senha', 'A senha precisa ter pelo menos 6 caracteres.');
    const id = Utils.uid('u');
    form.reset();
    StateManager.update((s) => { s.users.push({ id, nome, email, perfil, ativo: true, senhaHash: Utils.hashPassword(id, senha), criadoEm: Date.now() }); });
    UI.toast(`${nome} cadastrado(a) como ${AuthService.perfilLabel(perfil)}. Já pode entrar com a senha informada.`, 'ok');
  },
  'edit-user'(form) {
    const fd = new FormData(form); const id = fd.get('id'); const u = Repo.user(id); const me = AuthService.currentUser();
    const nome = String(fd.get('nome') || '').trim().replace(/\s+/g, ' ');
    const email = String(fd.get('email') || '').trim().toLowerCase();
    const perfil = fd.get('perfil'); const senha = String(fd.get('senha') || '');
    if (nome.length < 5 || !nome.includes(' ')) return UI.fieldError(form, 'nome', 'Informe o nome completo (nome e sobrenome).');
    if (!Utils.isEmail(email)) return UI.fieldError(form, 'email', 'Informe um e-mail válido.');
    const other = Repo.userByEmail(email); if (other && other.id !== id) return UI.fieldError(form, 'email', 'Já existe outro usuário com este e-mail.');
    if (id === me.id && perfil !== 'ADMIN') return UI.fieldError(form, 'perfil', 'Você não pode remover o próprio perfil de administrador.');
    if (u.perfil === 'PROFESSOR' && perfil !== 'PROFESSOR' && Repo.turmasDoProfessor(id).length) return UI.fieldError(form, 'perfil', 'Este professor é responsável por turmas. Reatribua as turmas antes de mudar o perfil.');
    if (u.perfil === 'ALUNO' && perfil !== 'ALUNO' && Repo.turmasDoAluno(id).length) return UI.fieldError(form, 'perfil', 'Este aluno está vinculado a turmas. Remova os vínculos antes de mudar o perfil.');
    if (senha && senha.length < 6) return UI.fieldError(form, 'senha', 'A nova senha precisa ter pelo menos 6 caracteres.');
    StateManager.update((s) => { const x = s.users.find((y) => y.id === id); x.nome = nome; x.email = email; x.perfil = perfil; if (senha) x.senhaHash = Utils.hashPassword(id, senha); });
    UI.modal.close(true); UI.toast('Usuário atualizado.', 'ok');
  },
  'new-disc'(form) {
    const fd = new FormData(form);
    const codigo = String(fd.get('codigo') || '').trim().toUpperCase(); const nome = String(fd.get('nome') || '').trim(); const aulas = Number(fd.get('aulas'));
    if (!/^[A-Z]{2,5}-\d{2,4}$/.test(codigo)) return UI.fieldError(form, 'codigo', 'Use o formato SIGLA-NÚMERO, como ALG-201.');
    if (StateManager.get().disciplinas.some((d) => d.codigo === codigo)) return UI.fieldError(form, 'codigo', 'Já existe uma disciplina com este código.');
    if (nome.length < 3) return UI.fieldError(form, 'nome', 'Informe o nome da disciplina.');
    if (!Number.isInteger(aulas) || aulas < 1 || aulas > 400) return UI.fieldError(form, 'aulas', 'Informe a quantidade de aulas previstas (de 1 a 400).');
    form.reset();
    StateManager.update((s) => { s.disciplinas.push({ id: Utils.uid('d'), codigo, nome, aulasPrevistas: aulas }); });
    UI.toast(`Disciplina ${codigo} cadastrada. Limite de faltas: ${Math.floor(aulas * CONFIG.LIMITE_FALTAS_RATIO)}.`, 'ok');
  },
  'edit-disc'(form) {
    const fd = new FormData(form); const id = fd.get('id'); const nome = String(fd.get('nome') || '').trim(); const aulas = Number(fd.get('aulas'));
    if (nome.length < 3) return UI.fieldError(form, 'nome', 'Informe o nome da disciplina.');
    if (!Number.isInteger(aulas) || aulas < 1 || aulas > 400) return UI.fieldError(form, 'aulas', 'Informe a quantidade de aulas previstas (de 1 a 400).');
    const realizadasMax = Math.max(0, ...Repo.turmas().filter((t) => t.disciplinaId === id).map((t) => Repo.aulasDaTurma(t.id).length));
    if (aulas < realizadasMax) return UI.fieldError(form, 'aulas', `Já existem ${realizadasMax} aulas registradas em uma turma desta disciplina. O total previsto não pode ser menor.`);
    const antes = Repo.disciplina(id).aulasPrevistas;
    StateManager.update((s) => { const d = s.disciplinas.find((x) => x.id === id); d.nome = nome; d.aulasPrevistas = aulas; });
    UI.modal.close(true);
    UI.toast(antes !== aulas ? `Disciplina atualizada. Limite de faltas: ${Math.floor(antes * 0.25)} → ${Math.floor(aulas * 0.25)}.` : 'Disciplina atualizada.', 'ok');
  },
  'new-turma'(form) {
    const fd = new FormData(form);
    const codigo = String(fd.get('codigo') || '').trim().toUpperCase(); const disciplinaId = fd.get('disciplinaId'); const professorId = fd.get('professorId');
    if (!/^[A-Z0-9][A-Z0-9-]{2,19}$/.test(codigo)) return UI.fieldError(form, 'codigo', 'Use letras, números e hífen (3 a 20 caracteres), como ESW401-N2.');
    if (StateManager.get().turmas.some((t) => t.codigo === codigo)) return UI.fieldError(form, 'codigo', 'Já existe uma turma com este código.');
    if (!Repo.disciplina(disciplinaId)) return UI.fieldError(form, 'disciplinaId', 'Escolha uma disciplina.');
    const prof = Repo.user(professorId); if (!prof || prof.perfil !== 'PROFESSOR' || !prof.ativo) return UI.fieldError(form, 'professorId', 'Escolha um professor ativo.');
    form.reset();
    StateManager.update((s) => { s.turmas.push({ id: Utils.uid('t'), codigo, disciplinaId, semestreId: CONFIG.SEMESTRE.id, professorId, alunoIds: [] }); });
    UI.toast(`Turma ${codigo} criada. Vincule os alunos em “Gerenciar vínculos”.`, 'ok');
  },
  'manage-turma'(form) {
    const fd = new FormData(form); const id = fd.get('id'); const professorId = fd.get('professorId'); const alunos = fd.getAll('alunos');
    const prof = Repo.user(professorId); if (!prof || prof.perfil !== 'PROFESSOR') return UI.fieldError(form, 'professorId', 'Escolha um professor.');
    const t = Repo.turma(id); const removed = t.alunoIds.filter((a) => !alunos.includes(a)).length; const added = alunos.filter((a) => !t.alunoIds.includes(a)).length;
    StateManager.update((s) => { const x = s.turmas.find((y) => y.id === id); x.professorId = professorId; x.alunoIds = alunos; });
    UI.modal.close(true);
    UI.toast(`Vínculos salvos: ${Utils.plural(alunos.length, 'aluno', 'alunos')} na turma${added ? `, ${added} adicionado(s)` : ''}${removed ? `, ${removed} removido(s)` : ''}.`, 'ok');
  },
  adjust(form) {
    const user = AuthService.currentUser(); const fd = new FormData(form);
    const aulaId = fd.get('aulaId'); const alunoId = fd.get('aluno');
    const r = AttendanceValidator.manualAdjust({ aulaId, alunoId, acao: fd.get('acao'), justificativa: fd.get('justificativa'), autorId: user.id });
    if (!r.ok) return UI.fieldError(form, r.field, r.message);
    const aluno = Repo.user(alunoId);
    UI.modal.close(true);
    UI.toast(`${fd.get('acao') === 'PRESENCA' ? 'Presença lançada' : 'Falta registrada'} para ${aluno.nome}. Frequência recalculada (RE06).`, 'ok');
  },
};

/* =============================================================== CHANGES/INPUT */
const Changes = {
  'set-validade'(el) {
    const r = QRCodeEngine.setValidade(el.dataset.aula, Number(el.value));
    if (!r.ok) { UI.toast(r.message, 'error'); return; }
    UI.toast(`Chamada aberta por ${r.aula.validadeMin} min a partir de agora (até ${Utils.fmtTime(r.aula.chamadaExpiraEm)}).`, 'ok'); UI.render();
  },
  'hist-turma'(el) { ui.prof.histTurma = el.value; ui.prof.histLimit = 20; UI.render(); },
  'freq-turma'(el) { ui.prof.freqTurma = el.value; UI.render(); },
  'user-perfil'(el) { ui.admin.userPerfil = el.value; UI.render(); },
  'report-turma'(el) { ui.admin.report.turmaId = el.value; UI.render(); },
  'report-status'(el) { ui.admin.report.status = el.value; UI.render(); },
  'adjust-aluno'(el) {
    const present = !!Repo.presenca(el.dataset.aula, el.value);
    const form = el.closest('form'); const p = form.querySelector('input[value="PRESENCA"]'); const f = form.querySelector('input[value="FALTA"]');
    p.disabled = present; f.disabled = !present; p.checked = !present; f.checked = present;
  },
};
const Inputs = {
  'user-q'(el) { ui.admin.userQ = el.value; UI.render(); },
  'report-q'(el) { ui.admin.report.q = el.value; UI.render(); },
};

/* ===================================================================== BOOT */
const App = {
  init() {
    StateManager.init();
    const u = AuthService.currentUser(); if (u && !u.ativo) AuthService.logout();

    document.addEventListener('click', (e) => {
      if (e.target.matches && e.target.matches('[data-modal-backdrop]')) { UI.modal.close(); return; }
      const el = e.target.closest('[data-action]');
      if (ui.menuOpen && !e.target.closest('#profile-menu-wrap')) { ui.menuOpen = false; if (!el) { UI.render(); return; } }
      if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true') return;
      const fn = Actions[el.dataset.action];
      if (!fn) { console.warn('Ação sem handler:', el.dataset.action); return; }
      e.preventDefault();
      fn(el, e);
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (UI.modal.isOpen()) { UI.modal.close(); return; }
        if (ui.projection) { UI.exitProjection(); return; }
        if (ui.menuOpen) { ui.menuOpen = false; UI.render(); const b = document.querySelector('[data-action="toggle-menu"]'); if (b) b.focus(); }
        return;
      }
      if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-action]:not(button)')) { e.preventDefault(); e.target.click(); }
    });
    document.addEventListener('submit', (e) => { const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); const fn = Forms[f.dataset.form]; if (fn) fn(f, e); });
    document.addEventListener('change', (e) => { const el = e.target.closest('[data-change]'); if (el && Changes[el.dataset.change]) Changes[el.dataset.change](el, e); });
    document.addEventListener('input', (e) => { const el = e.target.closest('[data-input]'); if (el && Inputs[el.dataset.input]) Inputs[el.dataset.input](el, e); });
    document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && ui.projection && ui.projectionFS) UI.exitProjection(); });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') UI.tick(); else if (ui.student.scanning) Actions['scan-stop'](); });

    window.addEventListener('hashchange', () => {
      const r = Router.parse();
      ui.menuOpen = false;
      if (r.name !== 'aluno' && ui.student.scanning) { CameraScanner.stop(); ui.student.scanning = false; }
      if (!(r.name === 'professor' && r.params[0] === 'chamada')) ui.projection = null;
      if (UI.modal.isOpen()) UI.modal.close();
      if (ui.lastRoute !== r.key) window.scrollTo(0, 0);
      ui.lastRoute = r.key;
      UI.render();
    });

    StateManager.subscribe((evt) => {
      if (evt.source === 'external' && !evt.significant) { UI.refreshQR(); return; }
      if (evt.source === 'external' && UI.modal.isOpen()) return; // não interrompe um formulário aberto
      UI.render();
    });

    ui.lastRoute = Router.parse().key;
    UI.render();
    setInterval(() => UI.tick(), 1000);
  },
};

App.init();
</script>
</body>
</html>
